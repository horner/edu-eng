          - py-anger-aggression-management-3
          - py-anger-aggression-management-5
          - py-anger-aggression-management-8
          - py-anger-aggression-management-9
          - py-anger-aggression-management-10
          - py-anger-aggression-management-11
          - py-anger-aggression-management-12
      - chapter: py-self-compassion-inner-critic
        why: Treating yourself with the kindness you would show a friend, and why it works better than self-criticism.
        depth: full
      - chapter: py-mindfulness-contemplative-science
        why: "Meditation and mindfulness: how to practise, what the evidence supports and who should take care."
        depth: full
      - chapter: py-evidence-based-self-help
        why: Skills from tested therapies for low mood and worry, and how to tell when self-help is not enough.
        depth: full
  - name: Connect
