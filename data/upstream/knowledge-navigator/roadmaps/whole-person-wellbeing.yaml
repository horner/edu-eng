id: whole-person-wellbeing
name: "Whole-Person Wellbeing: Body, Mind & Soul"
icon: 🧘
tagline: Look after body, mind and spirit together, one evidence-based pillar at a time.
description: For anyone who wants one joined-up route to looking after themselves rather than separate courses on fitness, mental health and self-care. After a foundation in how the body and mind work and how to judge health claims, you work through the pillars of wellbeing in turn (moving, eating, resting, managing emotions, connecting with others, finding meaning and caring for your appearance) and finish by turning them into habits that last.
outcomes:
  - Explain how physical health, mental health, relationships and meaning affect each other, using the biopsychosocial model
  - Plan a week that meets the activity guidelines, includes strength and mobility work, and follows an evidence-based eating pattern
  - Improve your sleep and manage stress with methods that have trial evidence, such as CBT-I principles, slow breathing and reappraisal
  - Use self-compassion, mindfulness and listening skills to handle difficult emotions and support the people around you
  - Describe what research says about purpose, gratitude, spirituality and Stoic practice, and choose practices that fit your values
  - Keep a simple skincare and hygiene routine with sun protection, and recognise how beauty ideals and social media affect body image
  - Write a personal wellbeing plan across all pillars, with habits, early-warning signs and when to seek professional help
stages:
  - name: "Foundations: how body and mind work"
    description: "The shared groundwork for every pillar: what health is, how the body and mind work, and how to judge what you read."
    items:
      - chapter: hf-introduction-to-health-wellness
        why: What health and wellness mean, what most affects how long and how well we live, and how the pillars fit together.
        depth: full
      - chapter: hf-health-literacy-evidence
        why: Wellness is a crowded market; this is how to weigh studies, risk figures and influencer claims.
        depth: full
      - chapter: bi-introductory-biology
        why: Cells, energy and homeostasis in brief, as groundwork for the body chapter.
        depth: selected
        focus:
          - bi-introductory-biology-2
          - bi-introductory-biology-3
          - bi-introductory-biology-5
          - bi-introductory-biology-6
      - chapter: hf-human-body-basics
        why: The organ systems and how they cooperate during exercise, eating, stress and sleep.
        depth: full
      - chapter: py-introduction-to-psychology
        why: How thoughts, emotions and behaviour work, and the biopsychosocial view that joins mind and body.
        depth: full
      - chapter: py-mental-health-literacy
        why: Mental health as a continuum, early warning signs and where to get help, so you know the limits of self-care from the start.
        depth: full
  - name: Move
    description: Physical activity is the pillar with the widest benefits, for the heart, muscles, bones, mood and sleep.
    items:
      - chapter: hf-exercise-fundamentals
        why: Activity guidelines, intensity, starting safely and a first weekly plan.
        depth: full
      - chapter: hf-walking-running
        why: Walking and running as the simplest way to build daily movement into life.
        depth: full
      - chapter: hf-training-principles-adaptations
        why: "Overload, progression and recovery: how the body gets fitter, and the minimum dose that still works."
        depth: selected
        focus:
          - hf-training-principles-adaptations-1
          - hf-training-principles-adaptations-2
          - hf-training-principles-adaptations-6
          - hf-training-principles-adaptations-9
          - hf-training-principles-adaptations-11
          - hf-training-principles-adaptations-13
      - chapter: hf-resistance-training
        why: The basics of strength training, which protects muscle, bone and independence as you age.
        depth: selected
        focus:
          - hf-resistance-training-1
          - hf-resistance-training-2
          - hf-resistance-training-3
          - hf-resistance-training-4
          - hf-resistance-training-6
          - hf-resistance-training-9
          - hf-resistance-training-13
          - hf-resistance-training-14
      - chapter: hf-flexibility-mobility
        why: What stretching and mobility work actually do, and a short routine to keep you moving freely.
        depth: selected
        focus:
          - hf-flexibility-mobility-1
          - hf-flexibility-mobility-3
          - hf-flexibility-mobility-6
          - hf-flexibility-mobility-8
          - hf-flexibility-mobility-11
          - hf-flexibility-mobility-13
      - chapter: hf-mind-body-movement
        why: Yoga, tai chi and qigong, which train body, breath and attention together.
        depth: full
  - name: Nourish
    description: Eating well for body and mind, from nutrients and dietary patterns to cooking and food and mood.
    items:
      - chapter: hf-nutrition-fundamentals
        why: "Nutrients, energy and food groups: the basis of every eating decision."
        depth: full
      - chapter: hf-healthy-eating-patterns
        why: The Mediterranean, DASH and plant-predominant patterns, and how to adapt them to your culture and budget.
        depth: full
      - chapter: hf-meal-planning-food-skills
        why: Planning, shopping, reading labels and cooking, where healthy eating becomes routine.
        depth: full
      - chapter: py-lifestyle-mental-health
        why: What trials show about food, exercise, nature and routine as ways to protect mood, and where the hype starts.
        depth: full
  - name: Rest and recover
    description: "Sleep and stress management: how the body and mind recover, and what to do when they cannot."
    items:
      - chapter: hf-sleep-science
        why: How sleep and the body clock work and what helps you sleep better.
        depth: full
      - chapter: py-sleep-insomnia-mental-health
        why: How sleep and mood affect each other, and why CBT for insomnia works better than pills or sleep hygiene alone.
        depth: full
      - chapter: py-stress-coping-resilience
        why: How stress works, which ways of coping help, burnout and resilience.
        depth: full
      - chapter: hf-stress-physiology-health
        why: What chronic stress does to the body and which relaxation methods, such as slow breathing, have evidence.
        depth: full
  - name: Regulate emotions
    description: Understanding and managing feelings, quieting the inner critic and training attention.
    items:
      - chapter: py-emotion-and-emotion-regulation
        why: What emotions are for and the practical skills (naming, allowing, reappraising) that help manage them.
        depth: full
      - chapter: py-anger-aggression-management
        why: Why venting backfires and how to handle anger and conflict calmly.
        depth: selected
        focus:
