        why: "Elective: people at work: selection interviews, motivation, leadership, teams and psychological safety."
        depth: full
      - chapter: py-psychopathology-foundations
        why: "Elective: groundwork for the personality-disorder and forensic chapters; how mental disorders are defined."
        depth: full
      - chapter: py-personality-disorders
        why: "Elective: narcissistic, antisocial and borderline patterns, and why armchair diagnosis of others is unreliable."
        depth: full
      - chapter: py-forensic-psychology
        why: "Elective: offending, interrogation and false confessions, offender profiling claims and jury decisions."
        depth: full
      - chapter: py-digital-wellbeing-cyberpsychology
        why: "Elective: online behaviour, disinhibition and persuasive design in apps and social media."
        depth: full
