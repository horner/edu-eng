          - bu-financial-accounting-4
          - bu-financial-accounting-5
          - bu-financial-accounting-6
          - bu-financial-accounting-7
          - bu-financial-accounting-12
          - bu-financial-accounting-13
      - chapter: bu-spreadsheet-modelling
        why: Your financial model, cap table and metrics will live in spreadsheets, so they need to be built so that they can be checked.
        depth: full
      - chapter: bu-managerial-cost-accounting
        why: Cost behaviour, cost-volume-profit analysis, cash budgets and customer profitability for everyday pricing and spending decisions.
        depth: selected
        focus:
