id: startup-founder
name: Startup Founder
icon: 🦄
tagline: Take an idea from the first customer conversations to a funded company that is growing.
description: For would-be founders and early startup staff with no business training; school maths is enough. You start with business basics and the numbers, then find and test an opportunity with real customers, work out a business model and its finances, set the company up legally, build a first product and win early customers through marketing and founder-led sales. The route ends with leading a team, raising money and what changes when a company scales.
outcomes:
  - Run customer discovery interviews without leading questions and decide from the evidence whether a problem is worth solving
  - Design a minimum viable product or smoke test and judge product-market fit from retention data rather than vanity metrics
  - Build a driver-based financial model with revenue, costs, cash flow, burn rate and runway, and work out unit economics such as CAC, lifetime value and payback period
  - Choose a legal structure and put founder agreements, vesting and IP assignment in place, and know when you need a lawyer
  - Write a positioning statement, pick two or three traction channels, set a launch price and close the first customers through founder-led sales
  - Compare bootstrapping, grants, angels and venture capital for your company, and read a term sheet and a cap table, including the dilution from a SAFE
  - Make the first hires, run one-to-ones and give feedback, and identify the roles and processes a company needs as it grows beyond its founders
stages:
  - name: Business basics and the decision to start
    description: The vocabulary of business, the arithmetic you will use every day, and an honest look at whether, when and with whom to start.
    items:
      - chapter: bu-introduction-to-business
        why: How product, sales, money and people fit together in a business, which is everything you will be responsible for as a founder.
        depth: full
      - chapter: ma-arithmetic-pre-algebra
        why: A refresher on fractions, percentages, ratios and estimation, the arithmetic behind every margin, growth rate and dilution figure.
        depth: selected
        focus:
          - ma-arithmetic-pre-algebra-4
          - ma-arithmetic-pre-algebra-5
          - ma-arithmetic-pre-algebra-6
          - ma-arithmetic-pre-algebra-7
          - ma-arithmetic-pre-algebra-9
          - ma-arithmetic-pre-algebra-11
      - chapter: ma-elementary-intermediate-algebra
        why: Enough algebra to write a cost or revenue formula, solve for break-even and read a straight-line graph.
        depth: selected
        focus:
          - ma-elementary-intermediate-algebra-5
          - ma-elementary-intermediate-algebra-6
          - ma-elementary-intermediate-algebra-7
          - ma-elementary-intermediate-algebra-11
      - chapter: bu-business-mathematics
        why: "Margins, mark-ups, interest, break-even and contribution: the arithmetic that decides whether a business can make money."
        depth: full
      - chapter: bu-entrepreneurship-startups
        why: The whole journey in one pass, so you know what lies ahead and can decide whether starting a company is right for you now.
        depth: full
      - chapter: bu-personal-finance
        why: How much personal runway you need before leaving a job, keeping personal and company money apart, and the risk of having most of your wealth in one illiquid company.
        depth: selected
        focus:
          - bu-personal-finance-1
          - bu-personal-finance-2
          - bu-personal-finance-3
          - bu-personal-finance-10
          - bu-personal-finance-11
          - bu-personal-finance-12
      - chapter: bu-founding-teams-early-hiring
        why: Choosing a co-founder, splitting equity and agreeing roles are early decisions that are hard to undo; the chapter also covers your first hires and early culture.
        depth: full
  - name: Finding and validating an opportunity
    description: Most startups fail because nobody wants what they built, so this stage tests the problem and the customer before you spend money on a product.
    items:
      - chapter: bu-startup-ideas-opportunity
        why: Where good ideas come from, how to size a market with TAM, SAM and SOM, and how to choose a first market you can actually win.
        depth: full
      - chapter: mk-marketing-principles
        why: Customer value, the marketing mix and the market environment, the basic ideas behind every later go-to-market decision.
        depth: full
      - chapter: mk-consumer-behavior
        why: How customers decide, why early adopters differ from the mainstream and how businesses buy, which tells you who to talk to first.
        depth: selected
        focus:
          - mk-consumer-behavior-2
          - mk-consumer-behavior-3
          - mk-consumer-behavior-6
          - mk-consumer-behavior-10
          - mk-consumer-behavior-13
          - mk-consumer-behavior-14
          - mk-consumer-behavior-15
      - chapter: ma-descriptive-statistics
        why: Averages, spread, simple charts and sampling basics, so you can summarise survey results and see why ten interviews are not a statistic.
        depth: selected
        focus:
          - ma-descriptive-statistics-4
          - ma-descriptive-statistics-3
          - ma-descriptive-statistics-1
          - ma-descriptive-statistics-2
          - ma-descriptive-statistics-9
      - chapter: mk-customer-research-basics
        why: Desk research, simple surveys, competitor maps and market sizing that a founder can do in days and with little money.
        depth: full
      - chapter: bu-customer-discovery
        why: "The core founder skill: interviewing customers about what they have actually done, writing down your hypotheses, and testing them with small experiments such as pre-sales."
        depth: full
      - chapter: bu-lean-startup-mvp
        why: Build the smallest product that tests your riskiest assumption, read retention cohorts, and decide whether to pivot or carry on.
        depth: full
  - name: Business models and founder finance
    description: Whether the business can make money, and the records, models and projections that show it to you, a lender or an investor.
    items:
      - chapter: bu-business-models
        why: The Business Model Canvas, revenue models and unit economics show whether each customer makes or loses money before you try to grow.
        depth: full
      - chapter: mk-marketing-maths-metrics
        why: Customer acquisition cost, payback, churn, simple lifetime value and funnel conversion rates, which investors ask about in the first meeting.
        depth: full
      - chapter: bu-bookkeeping-basics
        why: Clean records from the first day make tax returns, investor due diligence and knowing your real cash position far easier.
        depth: full
      - chapter: bu-financial-accounting
        why: Enough accounting to read your own income statement, balance sheet and cash flow statement, and to see why profit and cash are different.
