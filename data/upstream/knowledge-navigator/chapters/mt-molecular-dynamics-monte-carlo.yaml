  - id: mt-molecular-dynamics-monte-carlo-4
    name: "Integrating equations of motion: Verlet algorithms and time steps"
  - id: mt-molecular-dynamics-monte-carlo-5
    name: Thermostats, barostats and periodic boundary conditions
  - id: mt-molecular-dynamics-monte-carlo-6
    name: "Computing properties: diffusion coefficients, RDF, elastic constants and thermal conductivity"
  - id: mt-molecular-dynamics-monte-carlo-7
    name: Simulating defects, dislocations, fracture and phase transitions
  - id: mt-molecular-dynamics-monte-carlo-8
    name: Metropolis Monte Carlo and cluster expansions
  - id: mt-molecular-dynamics-monte-carlo-9
    name: Kinetic Monte Carlo for diffusion and growth
  - id: mt-molecular-dynamics-monte-carlo-10
    name: Rare events and accelerated dynamics
  - id: mt-molecular-dynamics-monte-carlo-11
    name: Practical simulation with LAMMPS and analysis with OVITO
