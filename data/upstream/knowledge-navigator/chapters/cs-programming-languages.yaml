    name: "Type systems: static versus dynamic, strong versus weak, type inference"
  - id: cs-programming-languages-7
    name: "Polymorphism: parametric, subtype and ad hoc"
  - id: cs-programming-languages-8
    name: Writing an interpreter for a small language
  - id: cs-programming-languages-9
    name: "Memory management: stack, heap and garbage collection"
  - id: cs-programming-languages-10
