id: cs-programming-languages
name: Programming Language Concepts
category: Programming Languages & Compilers
level: 3
priority: core
summary: The ideas shared by all programming languages (syntax, binding, scope, evaluation, types, control and objects), learned partly by writing interpreters.
prerequisites:
  - cs-functional-programming
  - cs-object-oriented-programming
  - cs-discrete-mathematics
related:
  - ma-type-theory
  - ma-formal-languages
topics:
