id: be-formulation-science
name: "Cosmetic Formulation Science: Emulsions, Surfactants & Rheology"
category: Cosmetic Chemistry & Formulation
level: 3
priority: core
summary: "The physical chemistry of cosmetic formulations: surfactant behaviour, emulsions, gels, powders and how to make products stable and pleasant to use."
