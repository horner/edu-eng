id: mt-defects
name: Defects in Crystals & Dislocations
category: Structure of Materials
level: 2
priority: core
summary: Introduces point, line, planar and volume defects, which control diffusion, strength, conductivity and almost every useful property.
prerequisites:
  - mt-crystal-structures
related:
  - ph-solid-state-physics
topics:
