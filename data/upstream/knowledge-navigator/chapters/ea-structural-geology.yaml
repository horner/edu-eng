  - id: ea-structural-geology-9
    name: Foliations, lineations and cleavage
  - id: ea-structural-geology-10
    name: Ductile shear zones and kinematic indicators
  - id: ea-structural-geology-11
    name: Microstructures and deformation mechanisms
  - id: ea-structural-geology-12
    name: Balanced and restored cross-sections
