    name: "Pollutant formation and control: NOx, CO, soot, unburned hydrocarbons"
  - id: me-combustion-engineering-11
    name: Burners, furnaces and combustion safety
  - id: me-combustion-engineering-12
    name: "Alternative fuels: hydrogen, ammonia and biofuels"
