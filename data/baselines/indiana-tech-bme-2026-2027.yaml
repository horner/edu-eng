gaps:
  - Faculty/registrar must confirm specific general-education choices, overlap replacement and
    higher-credit technical electives for an actual 122-credit plan.
  - The BME 3700 elective panel lists EE 2050 as prerequisite, whereas the current core lists ECE
    2100. Equivalence or substitution has not been assumed.
  - No current official semester grid or complete term offering schedule was captured.
  - The older public outcomes page lists two educational objectives; the current catalog lists
    three. Current catalog is the baseline for this prototype.
  - No official equivalence between proposed credit units and the required courses has been
    established.
historical_sources_excluded:
  - Official PDF plans from 2014–2015 and earlier show 128–129 credits. They were not used as
    current requirements.
