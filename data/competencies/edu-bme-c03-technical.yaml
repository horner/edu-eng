performance_criteria:
  - Predict and measure circuit behavior with Kirchhoff laws; document range, gain, uncertainty and
    safe bench limits.
  - Explain sampling and distinguish measurement artifacts from a physiological claim.
  - Use probability/statistics to compare repeated measurements and show how a human-factor
    requirement changes the design.
  - Explain a cellular/genetic mechanism relevant to the biological signal and its limits.
