id: edu-bme-c04-technical
name: Predict and test a biomechanical component
summary: Draw a justified load case and solve the relevant statics/dynamics and stress/strain model.
  Form and interpret a differential-equation or linear-system model; compare it to a prototype or
  simulation. Select a material with evidence, examine a failure, and explain the living/nonliving
  mechanical interaction.
