id: edu-bme-c02-technical
name: Quantify a physical system with defensible measurements
summary: Derive a mechanics prediction using forces, energy or momentum and the relevant derivative
  or integral. Calibrate an instrument against a reference at five or more points; report
  repeatability, uncertainty and justified limitations. Provide a tested script/notebook that
  another student can run from raw data without undocumented steps.
