id: edu-bme-c08-technical
name: Verify, explain and transfer a complete engineering result
summary: Run the agreed verification plan from versioned inputs and report passing, failing and
  untested requirements. Explain whether the final evidence supports the intended use and the
  remaining uncertainties. Independently solve an unfamiliar transfer problem and defend how a new
  source was evaluated and applied.
chapters:
  - edu-bme-capstone
prerequisites:
