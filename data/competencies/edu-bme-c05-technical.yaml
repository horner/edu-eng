id: edu-bme-c05-technical
name: Validate a physiological transport or signal model
summary: Construct a fluid/thermal/mass-balance model and state boundary conditions and assumptions.
  Analyze a signal or dynamic response, compare predicted and observed values, and explain residual
  error statistically. Relate material compatibility and physiology to model limitations and propose
  a discriminating next experiment.
