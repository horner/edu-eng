id: edu-bme-c01-technical
name: Frame a need and justify a first prototype
summary: Translate a documented user need into at least five measurable requirements and two
  alternatives. Explain one relevant anatomical mechanism and one chemical or material assumption;
  show correct units and calculus-based reasoning. Produce a dimensioned CAD model and compare a
  measured fixture dimension or load against the requirement.
