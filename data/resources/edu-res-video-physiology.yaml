limitations: Introductory terminology, not organ-system depth. The historical segment 2:33–3:47 and numerical
  trivia were not validated and are not assigned. Explain homeostasis as regulation within limits; do not
  interpret dramatic phrasing as invariance under arbitrary conditions.
