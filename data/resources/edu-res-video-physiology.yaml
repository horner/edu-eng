practice: "Locally authored activity: Draw a simple body diagram and describe the elbow relative to the wrist
  using proximal/distal, then identify sagittal, frontal and transverse cuts. Exchange a short location
  description with a teammate and revise any ambiguity. Verify one structure/function claim against the
  reading."
assessment_connection: "Term 1 individual: explain and source-check a mechanism; watching alone supplies no mastery result."
review_scope: Complete exported English transcript read; only assigned mechanism/terminology segments
  cross-checked. No claim of complete audiovisual viewing or approval of every historical, numerical or
  clinical assertion.
