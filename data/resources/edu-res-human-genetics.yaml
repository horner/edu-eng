schema_version: 1
id: edu-res-human-genetics
title: What are the different ways a genetic condition can be inherited?
creator: National Library of Medicine
provider: MedlinePlus Genetics
url: https://medlineplus.gov/genetics/understanding/inheritance/inheritancepatterns/
format: reading
topics:
  - edu-bme-anatomy-physiology
  - edu-bme-statistics
description: Compare single-gene inheritance patterns with multifactorial conditions.
access: Public text accessible without an account during this audit.
accuracy_evidence: Inspected autosomal, X-linked and mitochondrial patterns and the explicit limits for
  polygenic/environmental conditions.
engagement_rationale: A comparison table lets students contrast models rather than assume every trait is Mendelian.
review_status: content_reviewed
date_checked: 2026-10-25
practice: "Locally authored activity: For a fictional autosomal recessive condition, assume two heterozygous
  parents, full penetrance and independent conceptions. Calculate offspring genotype probabilities; contrast
  an X-linked hypothesis and explain why a polygenic trait cannot use the same simple model."
assessment_connection: "Term 3 individual: defend a probability/model choice and its limits; team: make
  synthetic-data assumptions explicit."
assessment_ids:
  - edu-bme-a03-individual
  - edu-bme-a03-team
review_scope: Selected mechanism text/diagrams inspected; not a full-course, clinical or subject-expert review.
role: supplement
limitations: Educational fictional cases only. Real family or clinical genetic interpretation is not part of
  the activity; penetrance, variation and chromosome biology need a sequenced course.
