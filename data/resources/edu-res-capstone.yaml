date_checked: 2026-10-25
practice: "Locally authored activity: In Term 7 create a need–requirement–test matrix with pass criteria and
  an early risk-reduction test; in Term 8 freeze the tested version, run the plan and have another pair
  reproduce the release."
assessment_connection: "Term 7 individual: justify a test before results are known; Term 7 team: demonstrate
  feasibility. Term 8 individual: defend failures/limits; Term 8 team: hand off the tested release and
  unresolved issues."
review_scope: Selected text, objectives, equations or worked examples were inspected; this is not full-course
  or faculty review.
limitations: Intentional source reuse across integration and capstone, not a second independent review.
  Clinical or living-system experiments need separately approved faculty protocols.
