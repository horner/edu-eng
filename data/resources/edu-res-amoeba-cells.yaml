id: edu-res-amoeba-cells
title: "Introduction to Cells: The Grand Cell Tour"
url: https://www.youtube.com/watch?v=8IlzKri08kk
topics:
  - edu-bme-anatomy-physiology
description: A pond-water discovery becomes a comic tour of a living cell. Meet the structures that
  make, move and export molecules, then imagine travelling as the cargo.
why_it_matters: Before designing something that interacts with living tissue, get curious about what
  a cell is doing. Its boundaries, molecular assembly and delivery routes help explain why a cell
  can respond very differently from a passive material.
accuracy_evidence: Read the complete original English transcript. Checked the assigned
  prokaryote/eukaryote contrast, shared ribosomes and membranes, selective barrier, and
  secreted-protein route through rough ER, vesicles, Golgi and plasma membrane against OpenStax
  Biology 2e sections 4.2–4.4. The secretion route applies to appropriately targeted proteins, not
  every protein.
engagement_rationale: "Observed in the transcript: a remembered microscope discovery, an invitation
  to travel inside the cell, an ER highway/Golgi packaging metaphor and an escape as secreted cargo.
  This creates a story to draw and interrupt with predictions; visual scale, full audiovisual pacing
  and learner enjoyment remain unreviewed."
practice: "Locally authored activity: Play “you are the cargo.” Draw a short comic following a
  protein destined for secretion from a ribosome on rough ER through vesicles and Golgi to the
  membrane. A partner closes one station: predict where the cargo might accumulate and explain which
  arrow needs checking. Swap roles and try a different station."
assessment_connection: "Term 1 individual: explain a structure–function mechanism and the limits of
  the cartoon. Term 3 individual: defend the cellular mechanism and a changed case without a
  teammate supplying the answer. The drawing is a spark for that explanation, not evidence that the
  whole cell-biology capability is mastered."
assessment_ids:
  - edu-bme-a01-individual
  - edu-bme-a03-individual
assigned_segments:
  - "0:09–4:37: pond-water discovery, cell types, membrane, cytoplasm and ribosomes"
  - "5:16–6:35: ER, vesicles and Golgi"
  - "8:14–8:53: leave the cell as appropriately targeted secreted protein"
limitations: A deliberately simplified tour, not a complete cell model. Drawings and factory
  metaphors are not molecular scale or literal agency. General cell-type statements have
  specialized-cell exceptions; use a typical secretory eukaryotic cell for the activity.
  Mitochondria, photosynthesis and numerical body-cell claims outside the assigned scope were not
  the focus of the cross-check.
related_sources:
