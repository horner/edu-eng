description: Use the calculator, variables, strings and lists to start a reproducible engineering data workflow.
access: Free public documentation. Running the activity requires a local Python installation or an
  institution-provided environment; no cloud account is required.
accuracy_evidence: Inspected numeric operations, variables, sequence examples and the floating-point precision caveat.
