practice: "Locally authored activity: Convert synthetic voltages [0, 0.5, 1.0] V using T=20V+5 degrees C;
  reject inputs outside 0–3.3 V. Add expected-value checks and a documented file/units interface, then
  reproduce a teammate’s run."
assessment_connection: "Term 2 individual: rebuild the transformation from raw inputs and explain a failure;
  team: agree a file/units interface and reproduce a teammate's run."
review_scope: Selected text, objectives, equations or worked examples were inspected; this is not full-course
  or faculty review.
limitations: The official tutorial assumes some programming experience. Beginners need instructor scaffolding
  plus functions, files, debugging and testing lessons.
