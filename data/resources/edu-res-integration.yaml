practice: "Locally authored activity: Write a mechanical/electrical/software interface contract and an
  integration sequence; deliberately introduce one synthetic mismatch, reproduce it, fix it and rerun
  acceptance checks."
assessment_connection: "Term 6 individual: explain the owned interface and failure evidence; team: demonstrate
  integrated requirements. Reuse in Term 8 release verification."
review_scope: Selected text, objectives, equations or worked examples were inspected; this is not full-course
  or faculty review.
assigned_sections:
  - 5.2 Product Integration
  - 5.3 Product Verification
  - 5.4 Product Validation
limitations: NASA process examples need adaptation; a classroom demonstration does not establish
  medical-device safety or market authorization.
