date_checked: 2026-10-25
practice: "Locally authored activity: Write an individual decision memo about a failed prototype requirement
  under schedule pressure; cite relevant clauses, affected stakeholders, uncertainty and an escalation path.
  Debate alternatives as a team."
assessment_connection: "Term 4 individual: defend an ethical tradeoff with evidence; Term 7/Term 8: truthfully
  communicate failed requirements, limits and responsibility."
review_scope: Selected text, objectives, equations or worked examples were inspected; this is not full-course
  or faculty review.
limitations: A code supports reasoning; it is not a full ethics curriculum, jurisdiction-specific licensing
  advice or evidence that a student has demonstrated ethical behavior.
