id: edu-res-human-factors
title: FDA — Applying Human Factors and Usability Engineering to Medical Devices
creator: US Food and Drug Administration, CDRH
provider: FDA
url: https://www.fda.gov/media/80481/download
format: reading
topics:
  - edu-bme-human-factors
  - edu-bme-design-foundations
