credit_summary:
  total: 122
  math_science: 40
  engineering: 58
  broad_education: 24
  status: proposed
  official_equivalence: not_established
  note: Single-counted proposed allocation. Official Indiana Tech general education is 30 credits but
    includes mathematics and science options, so it is not identical to the ABET broad-education
    classification.
gaps:
  - Faculty must calibrate depth, workload, assessment thresholds, prerequisites and
    concurrent-study scaffolding.
  - Current 2026–2027 required courses and prerequisites are captured; the proposed units are not
    official course substitutions. No official semester sequence was published on the captured
    degree page.
  - A faculty-defined living-system measurement experience, suitable facilities, protocols and
    oversight remain required.
  - No student attainment evidence or continuous-improvement cycle has been collected.
  - Credit classifications, general-education substitutions and standards applicability require
    academic review.
credit_policy: Credit-bearing units are a proposed allocation. Competencies, resources, practice and
  studio evidence refer to those units and add no duplicate credits.
status_meanings:
  draft: Complete enough for prototype review; academic decisions remain pending.
  assessed: An assessment opportunity is designed, not a claim that a student passed.
  demonstrated: Requires reviewed individual performance evidence; this public demo contains none.
recurring_practice:
  chapters:
    - edu-bme-communication
    - edu-bme-team-engineering
    - edu-bme-ethics-society
  terms:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
  note: Communication, collaboration, ethical reflection and feedback recur in every studio even where
    their introductory chapter appears only once.
general_education_crosswalk_status: pending_academic_review
graduate_profile:
  - id: independent-technical-reasoning
    capability: Formulate an unfamiliar engineering problem, choose and critique quantitative models,
      and explain uncertainty.
    competencies:
      - edu-bme-c05-technical
      - edu-bme-c08-technical
    assessments:
      - edu-bme-a08-individual
  - id: build-and-verify
    capability: Turn a stakeholder need into a constrained design, integrate it, and verify requirements
      with reproducible evidence.
    competencies:
      - edu-bme-c06-technical
      - edu-bme-c07-technical
      - edu-bme-c08-technical
    assessments:
      - edu-bme-a07-individual
      - edu-bme-a08-individual
      - edu-bme-a08-team
  - id: collaborate-and-lead
    capability: Decompose work, negotiate interfaces, rotate leadership, resolve integration failures
      and verify a team-process improvement.
    competencies:
      - edu-bme-c06-team
      - edu-bme-c08-team
    assessments:
      - edu-bme-a08-individual
      - edu-bme-a08-team
  - id: communicate-and-exercise-judgment
    capability: Explain a decision across audiences, document limits and weigh ethical, human and wider
      consequences.
    competencies:
      - edu-bme-c07-technical
      - edu-bme-c08-team
    assessments:
      - edu-bme-a07-individual
      - edu-bme-a08-individual
  - id: learn-independently
    capability: Evaluate a new source, apply it to an unfamiliar case and defend its limits without
      relying on teammates to answer.
    competencies:
      - edu-bme-c08-technical
    assessments:
      - edu-bme-a08-individual
elective_policy:
  review_status: academic_review_pending
  credits_in_existing_ledger: 6
  terms:
    - 7
    - 8
  meaning: Choose an advanced emphasis or coherent pair with a faculty reviewer. These choices use the
    two existing 3-credit elective units and add no credits. They are proposed options, not Indiana
    Tech approved elective substitutions.
  options:
    - id: advanced-biomechanics
      name: Advanced biomechanical modeling
      chapters:
        - edu-bme-biomechanics
        - edu-bme-engineering-mechanics-materials
      resources:
        - edu-res-biomechanics
        - edu-res-materials
      individual_evidence: Compare an analytical model with a numerical or experimental model; justify
        boundary conditions, sensitivity and a changed load case.
    - id: advanced-signals-controls
      name: Advanced biomedical signals and feedback
      chapters:
        - edu-bme-signals
        - edu-bme-systems-controls
      resources:
        - edu-res-fourier
        - edu-res-controls
      individual_evidence: Build and test a documented analysis/control pipeline; quantify noise, sampling
        and model limits on an unfamiliar synthetic case.
    - id: advanced-biomaterials-transport
      name: Advanced biomaterials and transport
      chapters:
